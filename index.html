<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Ring Breaker - Web Prototype</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #18213e 0%, #0b1020 62%, #070a13 100%);
    }
    .hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: env(safe-area-inset-bottom, 0px);
      padding: 12px 16px 16px;
      text-align: center;
      color: rgba(255,255,255,.62);
      font-size: 13px;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,.6);
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hint">長押しでビーム照射 / レベルアップ時はカードをタップ</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.floor(window.innerWidth * DPR);
    H = Math.floor(window.innerHeight * DPR);
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resize);
  resize();

  const state = {
    stage: 1,
    level: 1,
    xp: 0,
    xpNeed: 45,
    damage: 30,
    beamWidth: 11,
    auraDamage: 7,
    chainChance: 0,
    orbCount: 0,
    beamAngle: -Math.PI / 2,
    touching: false,
    gameOver: false,
    clear: false,
    choosing: false,
    cards: [],
    particles: [],
    damageTexts: [],
    shake: 0,
  };

  let ring = [];
  let ringRotation = 0;
  let ringRadius = 0;
  let ringSpeed = 0;
  let lastTime = performance.now();

  const upgrades = [
    { title: 'ビーム強化', desc: 'ダメージ +30%', apply: () => state.damage *= 1.3 },
    { title: 'ビーム拡大', desc: 'ビーム幅 +20%', apply: () => state.beamWidth *= 1.2 },
    { title: 'オーラ強化', desc: '近くの敵を自動で削る', apply: () => state.auraDamage += 6 },
    { title: 'チェイン', desc: '隣の敵にもダメージ', apply: () => state.chainChance = Math.min(.65, state.chainChance + .2) },
    { title: '衛星オーブ', desc: '回転弾を1つ追加', apply: () => state.orbCount = Math.min(5, state.orbCount + 1) },
  ];

  function center() { return { x: W / 2, y: H * 0.53 }; }
  function rand(min, max) { return Math.random() * (max - min) + min; }

  function newStage() {
    state.clear = false;
    state.gameOver = false;
    state.choosing = false;
    ring = [];
    const minSide = Math.min(W, H);
    ringRadius = minSide * (0.36 + Math.min(.08, state.stage * .01));
    ringSpeed = 0.34 + state.stage * 0.03;
    const count = 74 + state.stage * 8;
    const hp = 42 + state.stage * 14;
    for (let i = 0; i < count; i++) {
      ring.push({
        alive: true,
        hp,
        maxHp: hp,
        angle: (i / count) * Math.PI * 2,
        size: minSide * 0.018,
        flash: 0,
      });
    }
  }

  function levelUp() {
    state.level++;
    state.xp -= state.xpNeed;
    state.xpNeed = Math.floor(state.xpNeed * 1.3 + 20);
    state.choosing = true;
    const pool = [...upgrades].sort(() => Math.random() - .5);
    state.cards = pool.slice(0, 3);
  }

  function hitSegment(seg, amount, x, y, angleIndex) {
    if (!seg.alive) return;
    seg.hp -= amount;
    seg.flash = .06;
    state.shake = Math.min(4 * DPR, state.shake + .45 * DPR);

    if (Math.random() < .055) {
      state.damageTexts.push({ x: x + rand(-8,8)*DPR, y: y + rand(-8,8)*DPR, text: Math.max(1, Math.floor(amount)).toString(), life: .35, vy: -30 * DPR });
    }

    if (state.chainChance > 0 && Math.random() < state.chainChance) {
      const prev = ring[(angleIndex - 1 + ring.length) % ring.length];
      const next = ring[(angleIndex + 1) % ring.length];
      if (prev && prev.alive) prev.hp -= amount * .3;
      if (next && next.alive) next.hp -= amount * .3;
    }

    if (seg.hp <= 0) {
      seg.alive = false;
      state.xp += 2 + state.stage;
      for (let i = 0; i < 3; i++) {
        state.particles.push({ x, y, vx: rand(-75,75)*DPR, vy: rand(-75,75)*DPR, life: rand(.2,.42), size: rand(2,4)*DPR });
      }
      if (state.xp >= state.xpNeed && !state.choosing) levelUp();
    }
  }

  function segmentPosition(seg) {
    const c = center();
    const a = seg.angle + ringRotation;
    return {
      x: c.x + Math.cos(a) * ringRadius,
      y: c.y + Math.sin(a) * ringRadius,
      a,
    };
  }

  function update(dt) {
    if (state.gameOver || state.choosing || state.clear) return;

    ringRotation -= ringSpeed * dt;
    ringRadius -= (2.0 + state.stage * .1) * DPR * dt;

    const c = center();
    const playerRadius = Math.min(W, H) * 0.045;
    if (ringRadius < playerRadius + Math.min(W,H) * .04) {
      state.gameOver = true;
    }

    const alive = ring.filter(s => s.alive).length;
    if (alive === 0) {
      state.clear = true;
      setTimeout(() => {
        state.stage++;
        newStage();
      }, 900);
      return;
    }

    if (!state.touching) {
      let target = null;
      for (const seg of ring) if (seg.alive && (!target || seg.hp < target.hp)) target = seg;
      if (target) {
        const p = segmentPosition(target);
        state.beamAngle = Math.atan2(p.y - c.y, p.x - c.x);
      }
    }

    const beamRange = Math.max(W, H);
    const dirX = Math.cos(state.beamAngle);
    const dirY = Math.sin(state.beamAngle);
    const beamW = state.beamWidth * DPR;
    for (let i = 0; i < ring.length; i++) {
      const seg = ring[i];
      if (!seg.alive) continue;
      const p = segmentPosition(seg);
      const relX = p.x - c.x;
      const relY = p.y - c.y;
      const along = relX * dirX + relY * dirY;
      if (along < 0 || along > beamRange) continue;
      const dist = Math.abs(relX * dirY - relY * dirX);
      if (dist < beamW + seg.size) {
        hitSegment(seg, state.damage * dt, p.x, p.y, i);
      }
    }

    const auraR = Math.min(W,H) * .17;
    for (let i = 0; i < ring.length; i++) {
      const seg = ring[i];
      if (!seg.alive) continue;
      const p = segmentPosition(seg);
      const d = Math.hypot(p.x - c.x, p.y - c.y);
      if (d < auraR) hitSegment(seg, state.auraDamage * dt, p.x, p.y, i);
    }

    const t = performance.now() / 1000;
    for (let o = 0; o < state.orbCount; o++) {
      const oa = t * 2.3 + o * Math.PI * 2 / Math.max(1, state.orbCount);
      const ox = c.x + Math.cos(oa) * Math.min(W,H) * .14;
      const oy = c.y + Math.sin(oa) * Math.min(W,H) * .14;
      for (let i = 0; i < ring.length; i++) {
        const seg = ring[i];
        if (!seg.alive) continue;
        const p = segmentPosition(seg);
        if (Math.hypot(p.x - ox, p.y - oy) < seg.size + 13 * DPR) {
          hitSegment(seg, state.damage * .52 * dt, p.x, p.y, i);
        }
      }
    }

    for (const seg of ring) seg.flash = Math.max(0, seg.flash - dt);
    state.shake = Math.max(0, state.shake - 14 * DPR * dt);

    state.particles = state.particles.filter(p => (p.life -= dt) > 0);
    for (const p of state.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; }

    state.damageTexts = state.damageTexts.filter(d => (d.life -= dt) > 0);
    for (const d of state.damageTexts) { d.y += d.vy * dt; d.vy *= .96; }
  }

  function drawRoundedRect(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (state.shake > 0) ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));

    const c = center();
    const minSide = Math.min(W, H);

    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    ctx.lineWidth = 1 * DPR;
    for (let r = minSide * .13; r < minSide * .44; r += minSide * .08) {
      ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.stroke();
    }

    const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, minSide * .18);
    grad.addColorStop(0, 'rgba(105, 219, 255, .11)');
    grad.addColorStop(1, 'rgba(105, 219, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(c.x, c.y, minSide * .18, 0, Math.PI * 2); ctx.fill();

    const bx = Math.cos(state.beamAngle), by = Math.sin(state.beamAngle);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(state.beamAngle);
    const beamLen = Math.max(W,H);
    const beamGrad = ctx.createLinearGradient(0, 0, beamLen, 0);
    beamGrad.addColorStop(0, 'rgba(106, 235, 255, .78)');
    beamGrad.addColorStop(.48, 'rgba(106, 235, 255, .36)');
    beamGrad.addColorStop(1, 'rgba(106, 235, 255, 0)');
    ctx.fillStyle = beamGrad;
    ctx.shadowColor = 'rgba(106, 235, 255, .42)';
    ctx.shadowBlur = 9 * DPR;
    ctx.fillRect(0, -state.beamWidth * .5 * DPR, beamLen, state.beamWidth * DPR);
    ctx.restore();

    for (let i = 0; i < ring.length; i++) {
      const seg = ring[i];
      if (!seg.alive) continue;
      const p = segmentPosition(seg);
      const hpRate = Math.max(0, seg.hp / seg.maxHp);
      ctx.fillStyle = seg.flash > 0 ? 'rgba(255,255,255,.9)' : `rgba(${Math.floor(245 - hpRate * 20)}, ${Math.floor(72 + hpRate * 70)}, 255, .94)`;
      ctx.shadowColor = 'rgba(160, 90, 255, .34)';
      ctx.shadowBlur = 5 * DPR;
      ctx.beginPath();
      ctx.arc(p.x, p.y, seg.size * (seg.flash > 0 ? 1.22 : 1), 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.shadowColor = 'rgba(106,235,255,.7)';
    ctx.shadowBlur = 14 * DPR;
    ctx.fillStyle = '#ecfeff';
    ctx.beginPath(); ctx.arc(c.x, c.y, minSide * .035, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#26c6da';
    ctx.beginPath(); ctx.arc(c.x + bx * minSide * .018, c.y + by * minSide * .018, minSide * .017, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    const t = performance.now() / 1000;
    for (let o = 0; o < state.orbCount; o++) {
      const oa = t * 2.3 + o * Math.PI * 2 / Math.max(1, state.orbCount);
      const ox = c.x + Math.cos(oa) * minSide * .14;
      const oy = c.y + Math.sin(oa) * minSide * .14;
      ctx.fillStyle = '#fff8a6';
      ctx.beginPath(); ctx.arc(ox, oy, 7 * DPR, 0, Math.PI * 2); ctx.fill();
    }

    for (const p of state.particles) {
      ctx.fillStyle = `rgba(189, 147, 249, ${Math.max(0,p.life*2)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }

    ctx.font = `${12 * DPR}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const d of state.damageTexts) {
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1,d.life*3)})`;
      ctx.fillText(d.text, d.x, d.y);
    }

    ctx.restore();

    drawUI();
  }

  function drawUI() {
    const pad = 18 * DPR;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = `700 ${20 * DPR}px system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.fillText(`Stage ${state.stage}`, pad, pad + 8 * DPR);
    ctx.font = `600 ${15 * DPR}px system-ui, sans-serif`;
    ctx.fillText(`Lv.${state.level}`, pad, pad + 38 * DPR);

    const barX = pad, barY = pad + 66 * DPR, barW = W - pad * 2, barH = 9 * DPR;
    ctx.fillStyle = 'rgba(255,255,255,.13)';
    drawRoundedRect(barX, barY, barW, barH, barH / 2); ctx.fill();
    ctx.fillStyle = 'rgba(106,235,255,.85)';
    drawRoundedRect(barX, barY, Math.max(barH, barW * Math.min(1, state.xp / state.xpNeed)), barH, barH / 2); ctx.fill();

    if (state.clear) {
      overlayText('STAGE CLEAR!', '次のステージへ');
    }
    if (state.gameOver) {
      overlayText('GAME OVER', 'タップでリスタート');
    }
    if (state.choosing) drawCards();
  }

  function overlayText(title, sub) {
    ctx.fillStyle = 'rgba(0,0,0,.42)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'white';
    ctx.font = `800 ${42 * DPR}px system-ui, sans-serif`;
    ctx.fillText(title, W/2, H*.43);
    ctx.font = `600 ${17 * DPR}px system-ui, sans-serif`;
    ctx.fillText(sub, W/2, H*.49);
  }

  function drawCards() {
    ctx.fillStyle = 'rgba(0,0,0,.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'white';
    ctx.font = `800 ${30 * DPR}px system-ui, sans-serif`;
    ctx.fillText('LEVEL UP!', W/2, H*.22);
    ctx.font = `600 ${14 * DPR}px system-ui, sans-serif`;
    ctx.fillText('強化を1つ選んでね', W/2, H*.26);

    const cardW = W * .82;
    const cardH = 92 * DPR;
    const startY = H * .35;
    state.cardRects = [];
    for (let i = 0; i < state.cards.length; i++) {
      const x = (W - cardW)/2;
      const y = startY + i * (cardH + 18 * DPR);
      state.cardRects.push({x,y,w:cardW,h:cardH});
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      drawRoundedRect(x, y, cardW, cardH, 20 * DPR); ctx.fill();
      ctx.fillStyle = '#18213e';
      ctx.font = `800 ${21 * DPR}px system-ui, sans-serif`;
      ctx.textAlign = 'left';
      ctx.fillText(state.cards[i].title, x + 22 * DPR, y + 18 * DPR);
      ctx.fillStyle = 'rgba(24,33,62,.72)';
      ctx.font = `600 ${14 * DPR}px system-ui, sans-serif`;
      ctx.fillText(state.cards[i].desc, x + 22 * DPR, y + 52 * DPR);
    }
  }

  function pointerPos(e) {
    return { x: e.clientX * DPR, y: e.clientY * DPR };
  }

  function resetGame() {
    state.stage = 1;
    state.level = 1;
    state.xp = 0;
    state.xpNeed = 45;
    state.damage = 30;
    state.beamWidth = 11;
    state.auraDamage = 7;
    state.chainChance = 0;
    state.orbCount = 0;
    newStage();
  }

  function handlePointer(x, y) {
    if (state.gameOver) {
      resetGame();
      return;
    }
    if (state.choosing && state.cardRects) {
      for (let i = 0; i < state.cardRects.length; i++) {
        const r = state.cardRects[i];
        if (x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h) {
          state.cards[i].apply();
          state.choosing = false;
          return;
        }
      }
    }
    const c = center();
    state.beamAngle = Math.atan2(y - c.y, x - c.x);
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    state.touching = true;
    const p = pointerPos(e);
    handlePointer(p.x, p.y);
  });
  canvas.addEventListener('pointermove', e => {
    if (!state.touching || state.choosing || state.gameOver) return;
    const p = pointerPos(e);
    const c = center();
    state.beamAngle = Math.atan2(p.y - c.y, p.x - c.x);
  });
  window.addEventListener('pointerup', () => state.touching = false);
  window.addEventListener('pointercancel', () => state.touching = false);

  function loop(now) {
    const dt = Math.min(.033, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newStage();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
